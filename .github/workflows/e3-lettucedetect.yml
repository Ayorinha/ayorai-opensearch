name: E3 LettuceDetect (manual evaluation only)

# Manual-only evaluation. E3 runs are not CI measurements and do not
# contribute to automatic push/PR validation evidence.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
    e3-lettucedetect:
      name: e3-lettucedetect
      runs-on: ubuntu-latest
      timeout-minutes: 45
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
          with:
            python-version: "3.12"
            cache: pip
        - run: python -m pip install --upgrade pip
        - run: pip install -e ".[dev,nli]"
        - run: pip install "lettucedetect==0.2.3" "huggingface_hub>=0.34,<1"
        - name: Verify E3 frozen inputs
          run: |
            python - <<'PY'
            from pathlib import Path
            import hashlib
            p = Path("docs/eval/PREREGISTRATION-E3-LETTUCEDETECT.md")
            text = p.read_text(encoding="utf-8")
            assert "Amendment — 2026-10-03" in text
            assert "MADLAD-400 is removed from E3." in text
            assert "D1 — PT claim / EN document" in text
            assert "D2 — translated claim / EN document" in text
            assert hashlib.sha256(Path("evals/golden/v0.jsonl").read_bytes()).hexdigest() == "2613aefccf232989833b80c0d23257e6e9f312e0f6b720801a0658407b2f1c75"
            assert hashlib.sha256(Path("evals/golden/v0.1.jsonl").read_bytes()).hexdigest() == "a7076512196c1ee9670478f036f7a3996fe89a483efad140ec7b985a54846fb9"
            print("E3_FROZEN_INPUTS: PASS")
            PY
        - run: pytest
        - run: ruff check .
        - run: mypy src/ayorai_attractor
        - name: Run E3
          env:
            TOKENIZERS_PARALLELISM: "false"
          run: python scripts/run_e3_lettucedetect.py
        - name: Print E3 report hashes
          run: |
            sha256sum reports/e3-lettucedetect-results.json reports/E3-LETTUCEDETECT-RESULTS.md reports/f1-results.json
            tail -n 40 reports/E3-LETTUCEDETECT-RESULTS.md
        - name: Upload E3 reports
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
          with:
            name: e3-lettucedetect-${{ github.sha }}
            path: |
              reports/e3-lettucedetect-results.json
              reports/E3-LETTUCEDETECT-RESULTS.md
              reports/f1-results.json

