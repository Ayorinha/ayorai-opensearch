name: CI

concurrency:
  group: -github-workflows-ci-yml-main
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-smoke:
    name: golden-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run five-category golden smoke eval
        run: |
          attractor eval --suite smoke-v0 --out /tmp/golden-smoke.json
          python -c "import json; r=json.load(open('/tmp/golden-smoke.json')); assert r['case_count']==5; assert len(r['content_sha256'])==64; print('GOLDEN_SMOKE: PASS cases=5 digest='+r['content_sha256'])"

  golden-regression:
    name: golden-regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate frozen Golden v0
        run: python scripts/lint_golden.py
      - name: Execute all 34 Golden v0 cases
        run: |
          mkdir -p reports
          attractor eval --suite golden-v0 --out reports/golden-v0.json
          python -c 'import json; from pathlib import Path; r=json.loads(Path("reports/golden-v0.json").read_text()); assert r["case_count"] == 34; assert r["corpus_document_count"] == 52; assert r["cases_with_global_verdict"] == 30; assert r["majority_class_baseline"]["accuracy"] == 0.433333; assert set(r["confusion_matrix"]) == {"VERIFIED","SUPPORTED","PARTIALLY_SUPPORTED","UNVERIFIED","REFUTED","CONFLICTING"}; assert len(r["content_sha256"]) == 64; print("GOLDEN_V0: PASS", r["global_accuracy"], r["balanced_accuracy"], r["mcnemar_vs_legacy"], "digest="+r["content_sha256"])'
      - name: Upload reproducible evaluation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-v0-${{ github.sha }}
          path: reports/golden-v0.json
  judge-regression:
    name: judge-regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Execute deterministic Judge suite
        run: |
          python -c 'from pathlib import Path; from ayorai_attractor.evaluation.judge import evaluate_judge_suite; r=evaluate_judge_suite(Path("evals/judge/v0.jsonl")); assert r["case_count"] == 6; assert r["correct"] == 6; assert r["accuracy"] == 1.0; print("JUDGE_V0: PASS", r["confusion_matrix"])'
          python -c 'from pathlib import Path; from ayorai_attractor.evaluation.judge import evaluate_judge_suite; r=evaluate_judge_suite(Path("evals/golden/judge-smoke.jsonl")); assert r["case_count"] == 1; assert r["correct"] == 1; assert r["results"][0]["predicted"] == "SUPPORTED"; print("JUDGE_SMOKE: PASS", r["results"][0])'

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_ARCHIVE: "actionlint_1.7.12_linux_amd64.tar.gz"
        run: |
          set -euo pipefail
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ACTIONLINT_ARCHIVE}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${ACTIONLINT_ARCHIVE}" | sha256sum -c -
          tar -xzf "${ACTIONLINT_ARCHIVE}" actionlint
          install -m 0755 actionlint /usr/local/bin/actionlint
      - name: Validate all GitHub Actions workflows
        run: actionlint

  golden-lint:
    name: golden-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate CITATION.cff
        run: pipx run --spec cffconvert==2.0.0 cffconvert --validate
      - name: Reject file-wide Ruff suppression
        run: python -m pytest -q tests/test_ruff_suppression_guard.py
      - name: Print frozen evaluation SHA-256 evidence
        run: |
          set -euo pipefail
          sha256sum evals/golden/v0.jsonl
          sha256sum evals/golden/v0.1.jsonl
          sha256sum configs/f1-thresholds.json
          sha256sum pyproject.toml
          sha256sum src/ayorai_attractor/__init__.py
          sha256sum CHANGELOG.md
          sha256sum CITATION.cff
          sha256sum docs/release/v0.3.0.md
          sha256sum .github/workflows/ci.yml

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint Golden v0 closed-world contract
        run: python scripts/lint_golden.py
      - run: python -c "import mcp, agents, ayorai_attractor; print(mcp.__file__); print(agents.__file__); print(ayorai_attractor.__file__)"
      - run: ruff check .
      - run: mypy src/ayorai_attractor
      - name: Strict mypy blocking — evidence
        run: mypy --strict src/ayorai_attractor/evidence
      - run: pytest --cov=ayorai_attractor --cov-report=xml --cov-report=term-missing
      - name: Enforce monotonic coverage ratchet
        shell: bash
        run: |
          set -euo pipefail
          baseline=$(cat .github/coverage-baseline.txt)
          measured=$(coverage report --format=total | tr -d '%[:space:]')
          if [ -z "$measured" ]; then
            echo "::error::Could not determine measured coverage."
            exit 1
          fi
          measured_floor=$(python -c "import math; print(math.floor(float('$measured')))")
          if [ "$measured_floor" -lt "$baseline" ]; then
            echo "::error::Coverage dropped to ${measured}%. Baseline is ${baseline}%; restore coverage or update only if the baseline itself was incorrect."
            exit 1
          fi
          if [ "$measured_floor" -gt "$baseline" ]; then
            echo "::notice::Coverage improved to ${measured}%. The baseline remains ${baseline}% until explicitly reconciled."
          else
            echo "Coverage ratchet passed: measured=${measured}% baseline=${baseline}%."
          fi

  typecheck-strict:
    name: typecheck-strict (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run mypy --strict and report real errors
        shell: bash
        run: |
          set +e
          mypy --strict src/ayorai_attractor > /tmp/mypy-strict.log 2>&1
          set -e
          cat /tmp/mypy-strict.log
          python -c 'import re; from collections import Counter; from pathlib import Path; text=Path("/tmp/mypy-strict.log").read_text(encoding="utf-8"); rows=[re.match(r"^(src/ayorai_attractor/[^:]+\\.py):\\d+: error:", line) for line in text.splitlines()]; counts=Counter(m.group(1) for m in rows if m); total=sum(counts.values()); print(f"STRICT_MYPY_TOTAL_ERRORS={total}"); [print(f"STRICT_MYPY_MODULE {module} {count}") for module, count in sorted(counts.items())]'
          true


  namespace-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -c "import mcp, agents, ayorai_attractor; assert 'site-packages' in mcp.__file__; assert 'site-packages' in agents.__file__; print('official SDK namespaces resolved')"
      - run: pytest -q
