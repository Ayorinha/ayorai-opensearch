name: CI

concurrency:
  group: -github-workflows-ci-yml-main
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-smoke:
    name: golden-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run five-category golden smoke eval
        run: |
          attractor eval --suite smoke-v0 --out /tmp/golden-smoke.json
          python -c "import json; r=json.load(open('/tmp/golden-smoke.json')); assert r['case_count']==5; print('GOLDEN_SMOKE: PASS cases=5')"

  golden-regression:
    name: golden-regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate frozen Golden v0
        run: python scripts/lint_golden.py
      - name: Execute all 34 Golden v0 cases
        run: |
          mkdir -p reports
          attractor eval --suite golden-v0 --out reports/golden-v0.json
          python -c 'import json; from pathlib import Path; r=json.loads(Path("reports/golden-v0.json").read_text()); assert r["case_count"] == 34; assert r["corpus_document_count"] == 52; assert r["majority_class_baseline"]["accuracy"] == 0.433333; print("GOLDEN_V0: PASS", r["global_accuracy"], r["injection_resistance"], r["latency_ms"])'
      - name: Upload reproducible evaluation report
        uses: actions/upload-artifact@v7
        with:
          name: golden-v0-${{ github.sha }}
          path: reports/golden-v0.json
  judge-regression:
    name: judge-regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Execute deterministic Judge suite
        run: |
          python -c 'from pathlib import Path; from ayorai_attractor.evaluation.judge import evaluate_judge_suite; r=evaluate_judge_suite(Path("evals/judge/v0.jsonl")); assert r["case_count"] == 6; assert r["correct"] == 6; assert r["accuracy"] == 1.0; print("JUDGE_V0: PASS", r["confusion_matrix"])'

  golden-lint:
    name: golden-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint Golden v0 closed-world contract
        run: python scripts/lint_golden.py
      - run: python -c "import mcp, agents, ayorai_attractor; print(mcp.__file__); print(agents.__file__); print(ayorai_attractor.__file__)"
      - run: ruff check .
      - run: mypy src/ayorai_attractor
      - name: Strict mypy blocking — evidence
        run: mypy --strict src/ayorai_attractor/evidence
      - run: pytest --cov=ayorai_attractor --cov-report=xml --cov-report=term-missing
      - name: Enforce monotonic coverage ratchet
        shell: bash
        run: |
          set -euo pipefail
          baseline=$(cat .github/coverage-baseline.txt)
          measured=$(coverage report --format=total | tr -d '%[:space:]')
          if [ -z "$measured" ]; then
            echo "::error::Could not determine measured coverage."
            exit 1
          fi
          measured_floor=$(python -c "import math; print(math.floor(float('$measured')))")
          if [ "$measured_floor" -lt "$baseline" ]; then
            echo "::error::Coverage dropped to ${measured}%. Baseline is ${baseline}%; restore coverage or update only if the baseline itself was incorrect."
            exit 1
          fi
          if [ "$measured_floor" -gt "$baseline" ]; then
            echo "::notice::Coverage improved to ${measured}%. The baseline remains ${baseline}% until explicitly reconciled."
          else
            echo "Coverage ratchet passed: measured=${measured}% baseline=${baseline}%."
          fi

  typecheck-strict:
    name: typecheck-strict (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run mypy --strict and report real errors
        shell: bash
        run: |
          set +e
          mypy --strict src/ayorai_attractor > /tmp/mypy-strict.log 2>&1
          rc=$?
          set -e
          cat /tmp/mypy-strict.log
          python - <<'PY'
          from collections import Counter
          import re
          from pathlib import Path

          text = Path("/tmp/mypy-strict.log").read_text(encoding="utf-8")
          counts: Counter[str] = Counter()
          total = 0
          for line in text.splitlines():
              match = re.match(r"^(src/ayorai_attractor/[^:]+\.py):\d+: error:", line)
              if match:
                  counts[match.group(1)] += 1
                  total += 1
          print(f"STRICT_MYPY_TOTAL_ERRORS={total}")
          for module, count in sorted(counts.items()):
              print(f"STRICT_MYPY_MODULE {module} {count}")
          raise SystemExit(0)

  namespace-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -c "import mcp, agents, ayorai_attractor; assert 'site-packages' in mcp.__file__; assert 'site-packages' in agents.__file__; print('official SDK namespaces resolved')"
      - run: pytest -q
