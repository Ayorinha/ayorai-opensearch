name: Phase 1b DEV — re-aggregate full Calibration V2

# Maintainer-gated recovery path: re-runs ONLY the aggregate step of an already completed
# full DEV run, reusing that run's encrypted shard artifacts (before they expire).
# No inference, no TEST split, no automatic dispatch.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run ID of a phase1b-dev-full.yml run whose shards all succeeded
        required: true
        type: string
      confirmation:
        description: Confirm re-aggregation of an existing full DEV run
        required: true
        type: choice
        options:
          - reaggregate-full-dev-calibration-v2
        default: reaggregate-full-dev-calibration-v2

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'reaggregate-full-dev-calibration-v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: international-benchmark-maintainer-approval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install "pip==25.2"
          python -m pip install --require-hashes --only-binary :all: --index-url https://pypi.org/simple -r requirements-phase1b-protected.txt
      - name: Verify source run provenance
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "source_run_id must be numeric"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > /tmp/source-run.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | {name, conclusion}' > /tmp/source-jobs.jsonl
          python - <<'PY'
          import json
          from pathlib import Path

          run = json.loads(Path("/tmp/source-run.json").read_text())
          jobs = [json.loads(line) for line in Path("/tmp/source-jobs.jsonl").read_text().splitlines()]
          assert run["path"] == ".github/workflows/phase1b-dev-full.yml", run["path"]
          assert run["event"] == "workflow_dispatch"
          assert run["head_branch"] == "main"
          assert run["status"] == "completed"
          plan = [job for job in jobs if job["name"] == "plan"]
          shards = [job for job in jobs if job["name"].startswith("shard")]
          assert len(plan) == 1 and plan[0]["conclusion"] == "success"
          assert len(shards) == 93, len(shards)
          assert all(job["conclusion"] == "success" for job in shards)
          print(f"SOURCE_RUN_VERIFIED head_sha={run['head_sha']} shards={len(shards)}")
          PY
          # head_branch alone also matches a tag named "main": require the source commit
          # to be on main of this repository.
          SOURCE_REPOSITORY="$(python -c 'import json; print(json.load(open("/tmp/source-run.json"))["head_repository"]["full_name"])')"
          SOURCE_SHA="$(python -c 'import json; print(json.load(open("/tmp/source-run.json"))["head_sha"])')"
          test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_SHA}...main" --jq .status)"
          [[ "$status" == "identical" || "$status" == "ahead" ]] \
            || { echo "source commit is not on main"; exit 1; }
          # Re-uploaded caches keep the source run's 30-day window instead of starting a
          # new one, so re-aggregation cannot extend the life of the gold labels.
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import math
          from datetime import datetime, timezone
          from pathlib import Path

          run = json.loads(Path("/tmp/source-run.json").read_text())
          created = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
          age_days = (datetime.now(timezone.utc) - created).total_seconds() / 86400
          remaining = 30 - math.ceil(age_days)
          assert remaining >= 1, "source run caches are past the 30-day retention window"
          print(f"cache_retention_days={remaining}")
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phase1b-dev-full-manifest-encrypted
          path: /tmp/phase1b-manifest
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: phase1b-dev-full-encrypted-*
          path: /tmp/phase1b-encrypted
          merge-multiple: true
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phase1b-dev-gold-label-cache
          path: /tmp/phase1b-gold-labels
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Decrypt, compute Calibration V2, and validate aggregate-only report
        env:
          PHASE1B_ARTIFACT_ENCRYPTION_KEY: ${{ secrets.PHASE1B_ARTIFACT_ENCRYPTION_KEY }}
          PHASE1B_GOLD_LABEL_ENCRYPTION_KEY: ${{ secrets.PHASE1B_GOLD_LABEL_ENCRYPTION_KEY }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          trap 'rm -rf /tmp/phase1b-encrypted /tmp/phase1b-manifest' EXIT
          mkdir -p /tmp/phase1b-output
          SOURCE_CODE_SHA="$(python -c 'import json; print(json.load(open("/tmp/source-run.json"))["head_sha"])')"
          python scripts/benchmarks/phase1b/manifest_artifact.py decrypt \
            --input /tmp/phase1b-manifest/phase1b-manifest.json.aesgcm \
            --output /tmp/phase1b-manifest/phase1b-manifest.json \
            --run-id "$SOURCE_RUN_ID" --code-sha "$SOURCE_CODE_SHA"
          rm -f /tmp/phase1b-manifest/phase1b-manifest.json.aesgcm
          test "$(find /tmp/phase1b-encrypted -name '*.json' | wc -l)" -eq 93
          python scripts/benchmarks/phase1b/aggregate_dev.py \
            --manifest /tmp/phase1b-manifest/phase1b-manifest.json \
            --encrypted-dir /tmp/phase1b-encrypted \
            --output /tmp/phase1b-output/phase1b-aggregate.json --calibration-v2 \
            --gold-label-cache-input /tmp/phase1b-gold-labels/phase1b-dev-gold-label-cache.json \
            --score-cache-output /tmp/phase1b-score-cache/phase1b-dev-score-cache.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("/tmp/phase1b-output/phase1b-aggregate.json").read_text())
          source = json.loads(Path("/tmp/source-run.json").read_text())
          serialized = json.dumps(report, sort_keys=True)
          assert report["complete"] is True
          assert report["quality_metrics"] == "calibration_v2_aggregate_only"
          assert report["instance_level_output_published"] is False
          assert report["calibration_v2"]["certification_model_count"] == 1
          assert "record_id" not in serialized
          assert "records" not in serialized
          provenance = {
              "schema_version": "phase1b-dev-reaggregate-provenance-v1",
              "source_run_id": os.environ["SOURCE_RUN_ID"],
              "source_head_sha": source["head_sha"],
              "aggregate_run_id": os.environ["GITHUB_RUN_ID"],
              "aggregate_code_sha": os.environ["GITHUB_SHA"],
              "report_sha256": report["report_sha256"],
              "manifest_sha256": report["manifest_sha256"],
          }
          Path("/tmp/phase1b-output/PROVENANCE.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(provenance, sort_keys=True))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase1b-dev-full-aggregate
          path: |
            /tmp/phase1b-output/phase1b-aggregate.json
            /tmp/phase1b-output/PROVENANCE.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase1b-dev-gold-label-cache
          path: /tmp/phase1b-gold-labels/phase1b-dev-gold-label-cache.json
          if-no-files-found: error
          retention-days: ${{ steps.source.outputs.cache_retention_days }}
      # A1: prediction and gold-label caches use distinct AES-256-GCM keys.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase1b-dev-score-cache
          path: /tmp/phase1b-score-cache/phase1b-dev-score-cache.json
          if-no-files-found: error
          retention-days: ${{ steps.source.outputs.cache_retention_days }}

# No inference, no TEST split/job, no dispatch from repository tooling, no automatic trigger.
