name: Phase 1b inference equivalence

# P4-01: any change to the Phase 1b inference environment or shard code must keep the
# historical scores. Runs the exact shard code (run_shard.run_inference) for the three
# pinned models on deterministic synthetic text (no benchmark data, no secrets) under the
# historical environment (torch 2.7.1 and transformers 4.55.4, from the preserved repro
# branch) and the current locks, one job per environment and model, and fails unless
# chunking matches and scores agree within 1e-5 with no decision change.

on:
  pull_request:
    branches: [main]
    paths:
      - "requirements-phase1b-inference.txt"
      - "requirements-phase1b-torch-cpu.txt"
      - "scripts/benchmarks/phase1b/run_shard.py"
      - "scripts/benchmarks/phase1b/protocols.py"
      - "scripts/benchmarks/phase1b/vendor_nltk/**"
      - "scripts/benchmarks/phase1b/inference_equivalence.py"
      - ".github/workflows/phase1b-inference-equivalence.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PHASE1B_NLTK_DATA: /tmp/punkt
  HISTORICAL_SHA: 0edc35b97ea6cd69d2b3e1258db355d7b31eb6a7

jobs:
  score:
    name: score (${{ matrix.environment }}, ${{ matrix.model }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        environment: [historical, current]
        model: [mdeberta, minicheck, factcg]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.environment == 'historical'
        with:
          ref: ${{ env.HISTORICAL_SHA }}
          path: historical
          sparse-checkout: reproducibility/phase1b-dev-2026-11-07
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the historical environment (hash-verified)
        if: matrix.environment == 'historical'
        run: |
          set -euo pipefail
          echo "cf052d1fb0c78a688349476b71ebd4b0856419945ba07b2d74997f2220347000  historical/reproducibility/phase1b-dev-2026-11-07/inference-requirements.lock.txt" | sha256sum --check --strict -
          python -m venv /tmp/env
          /tmp/env/bin/python -m pip install "pip==25.2"
          # Historical torch 2.7.1+cpu, hash read from the official wheel (CI run 46155990585).
          printf 'torch==2.7.1+cpu --hash=sha256:%s\n' \
            8f8b3cfc53010a4b4a3c7ecb88c212e9decc4f5eeb6af75c3c803937d2d60947 > /tmp/torch-historical.txt
          /tmp/env/bin/python -m pip install --require-hashes --only-binary :all: --no-deps \
            --index-url https://download.pytorch.org/whl/cpu -r /tmp/torch-historical.txt
          /tmp/env/bin/python -m pip install --require-hashes --only-binary :all: --no-deps \
            --index-url https://pypi.org/simple \
            -r historical/reproducibility/phase1b-dev-2026-11-07/inference-requirements.lock.txt
      - name: Install the current environment (hash-verified)
        if: matrix.environment == 'current'
        run: |
          set -euo pipefail
          python -m venv /tmp/env
          /tmp/env/bin/python -m pip install "pip==25.2"
          /tmp/env/bin/python -m pip install --require-hashes --only-binary :all: --no-deps \
            --index-url https://download.pytorch.org/whl/cpu -r requirements-phase1b-torch-cpu.txt
          /tmp/env/bin/python -m pip install --require-hashes --only-binary :all: --no-deps \
            --index-url https://pypi.org/simple -r requirements-phase1b-inference.txt
          /tmp/env/bin/python -m pip check
      - name: Fetch the pinned punkt_tab data (SHA-256 verified)
        run: /tmp/env/bin/python -I scripts/benchmarks/phase1b/nltk_resources.py --data-dir "$PHASE1B_NLTK_DATA"
      - name: Score synthetic pairs
        env:
          MODEL: ${{ matrix.model }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          /tmp/env/bin/python -I scripts/benchmarks/phase1b/inference_equivalence.py \
            --model "$MODEL" --output "/tmp/scores-${ENVIRONMENT}-${MODEL}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scores-${{ matrix.environment }}-${{ matrix.model }}
          path: /tmp/scores-${{ matrix.environment }}-${{ matrix.model }}.json
          if-no-files-found: error
          retention-days: 30

  compare:
    name: phase1b-inference-equivalence
    needs: score
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scores-*
          path: /tmp/scores
          merge-multiple: true
      - name: Compare the historical and the current scores
        run: |
          set -euo pipefail
          for env in historical current; do
            python -I scripts/benchmarks/phase1b/inference_equivalence.py \
              --merge /tmp/scores/scores-${env}-*.json --output "/tmp/scores-${env}.json"
          done
          python -I scripts/benchmarks/phase1b/inference_equivalence.py \
            --compare /tmp/scores-historical.json /tmp/scores-current.json \
            --output /tmp/inference-equivalence.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: phase1b-inference-equivalence-${{ github.sha }}
          path: /tmp/inference-equivalence.json
          if-no-files-found: warn
          retention-days: 30
