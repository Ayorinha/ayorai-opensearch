name: Security

concurrency:
  group: -github-workflows-security-yml-main
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pip-audit
      - name: Generate CycloneDX SBOM
        if: always()
        run: |
          mkdir -p reports
          pip-audit --format cyclonedx-json --output reports/sbom.cdx.json
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sbom-${{ github.sha }}
          path: reports/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - run: bandit -r src/ayorai_attractor
