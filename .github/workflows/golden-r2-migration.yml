name: Golden r2 Migration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    name: Deterministic derived Golden migration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify two independent runs are byte-identical
        run: python scripts/migrate_golden_r2.py --check-determinism
      - name: Regenerate and compare checked-in derived files
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(python -c 'import json; print(json.load(open("evals/golden/v0-r2.MANIFEST.json", encoding="utf-8"))["migration"]["source_commit"])')"
          export SOURCE_COMMIT
          python scripts/migrate_golden_r2.py --output-dir /tmp/golden-r2
          for file in v0-r2.jsonl v0-r2.MANIFEST.json v0.1-r2.jsonl v0.1-r2.MANIFEST.json; do
            cmp "evals/golden/$file" "/tmp/golden-r2/$file"
          done
          git diff --exit-code -- evals/golden/v0.jsonl evals/golden/v0.1.jsonl evals/golden/MANIFEST.json evals/golden/v0.1.MANIFEST.json evals/corpus rules/judge-2.0.0.json
      - name: Upload derived migration artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-r2-derived-${{ github.sha }}
          path: /tmp/golden-r2/*
          if-no-files-found: error
