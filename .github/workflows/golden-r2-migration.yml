name: Golden r2 Migration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    name: Deterministic derived Golden migration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify two independent runs are byte-identical
        run: python scripts/migrate_golden_r2.py --check-determinism
      - name: Generate derived files for review
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python scripts/migrate_golden_r2.py --output-dir /tmp/golden-r2
          git diff --exit-code -- evals/golden/v0.jsonl evals/golden/v0.1.jsonl evals/golden/MANIFEST.json evals/golden/v0.1.MANIFEST.json evals/corpus rules/judge-2.0.0.json
          for file in /tmp/golden-r2/*; do
            printf 'DERIVED_FILE_BEGIN:%s\n' "${file##*/}"
            base64 --wrap=0 "$file"
            printf '\nDERIVED_FILE_END:%s\n' "${file##*/}"
          done
      - name: Upload derived migration artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-r2-derived-${{ github.sha }}
          path: /tmp/golden-r2/*
          if-no-files-found: error
