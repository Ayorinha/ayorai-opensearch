name: Null body compatibility reproduction

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/repro_null_body_contract.py"
      - ".github/workflows/null-body-compatibility.yml"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fastapi-sweep:
    name: FastAPI ${{ matrix.fastapi }} / Pydantic 2.14.1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        fastapi:
          - "0.128.2"
          - "0.129.0"
          - "0.130.0"
          - "0.131.0"
          - "0.132.0"
          - "0.133.0"
          - "0.134.0"
          - "0.135.0"
          - "0.136.0"
          - "0.137.0"
          - "0.138.0"
          - "0.139.0"
          - "0.140.0"
          - "0.141.0"
          - "0.142.0"
          - "0.143.0"
          - "0.144.0"
          - "0.145.0"
          - "0.146.0"
          - "0.147.0"
          - "0.148.0"
          - "0.149.0"
          - "0.150.0"
          - "0.151.0"
          - "0.152.0"
          - "0.153.0"
          - "0.154.0"
          - "0.155.0"
          - "0.156.0"
          - "0.156.1"
          - "0.156.2"
          - "0.156.3"
          - "0.156.4"
          - "0.156.5"
          - "0.156.6"
          - "0.156.7"
          - "0.156.8"
          - "0.157.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install isolated dependency pair
        run: python -m pip install "fastapi==${{ matrix.fastapi }}" "pydantic==2.14.1" "httpx==0.28.1"
      - name: Reproduce JSON null without project fixtures
        run: python scripts/repro_null_body_contract.py

  pydantic-sweep:
    name: FastAPI 0.157.0 / Pydantic ${{ matrix.pydantic }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        pydantic: ["2.10.0", "2.13.5", "2.14.0", "2.14.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install isolated dependency pair
        run: python -m pip install "fastapi==0.157.0" "pydantic==${{ matrix.pydantic }}" "httpx==0.28.1"
      - name: Reproduce JSON null without project fixtures
        run: python scripts/repro_null_body_contract.py
