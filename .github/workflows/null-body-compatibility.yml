name: Null body compatibility reproduction

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/repro_null_body_contract.py"
      - ".github/workflows/null-body-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: FastAPI ${{ matrix.fastapi }} / Pydantic ${{ matrix.pydantic }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        fastapi: ["0.115.0", "0.117.0", "0.119.0", "0.121.0", "0.123.0", "0.125.0", "0.127.0", "0.128.2"]
        pydantic: ["2.10.0", "2.13.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install isolated dependency pair
        run: python -m pip install "fastapi==${{ matrix.fastapi }}" "pydantic==${{ matrix.pydantic }}" "httpx==0.27.2"
      - name: Reproduce JSON null without project fixtures
        run: python scripts/repro_null_body_contract.py
