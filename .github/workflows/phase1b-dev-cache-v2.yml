name: Phase 1b DEV — build score cache v2 (document ids)

# Rebuilds the record → document association for an existing encrypted DEV score
# cache, using the pinned public DEV parquet (record_id is a content address of the
# whole row). No inference, no TEST split, no automatic trigger. The DEV text is used
# in memory only and deleted; only the encrypted cache v2 and per-cohort aggregate
# counts are uploaded. Maintainer dispatch and environment approval only.

on:
  workflow_dispatch:
    inputs:
      cache_run_id:
        description: Run ID that produced the v1 phase1b-dev-score-cache artifact
        required: true
        type: string
      confirmation:
        description: Confirm building cache v2 from the pinned DEV split
        required: true
        type: choice
        options:
          - build-dev-score-cache-v2
        default: build-dev-score-cache-v2

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: ${{ inputs.confirmation == 'build-dev-score-cache-v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: international-benchmark-maintainer-approval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install "pip==25.2"
          python -m pip install --index-url https://pypi.org/simple \
            huggingface-hub==0.34.4 pyarrow==21.0.0 cryptography==46.0.3 numpy==2.2.6
      - name: Verify cache source run
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_RUN_ID: ${{ inputs.cache_run_id }}
        run: |
          set -euo pipefail
          [[ "$CACHE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "cache_run_id must be numeric"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CACHE_RUN_ID}" > /tmp/cache-run.json
          python - <<'PY'
          import json
          from pathlib import Path

          run = json.loads(Path("/tmp/cache-run.json").read_text())
          allowed = {
              ".github/workflows/phase1b-dev-full.yml",
              ".github/workflows/phase1b-dev-full-reaggregate.yml",
          }
          assert run["path"] in allowed, run["path"]
          assert run["head_branch"] == "main"
          assert run["event"] == "workflow_dispatch"
          assert run["status"] == "completed" and run["conclusion"] == "success"
          print(f"CACHE_RUN_VERIFIED path={run['path']} head_sha={run['head_sha']}")
          PY
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: phase1b-dev-score-cache
          path: /tmp/phase1b-score-cache-v1
          run-id: ${{ inputs.cache_run_id }}
          github-token: ${{ github.token }}
      - name: Download and verify immutable DEV parquet
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/benchmarks/phase1b/fetch_dev.py --output /tmp/phase1b-dev/dev.parquet
      - name: Build cache v2 in the protected job (DEV only; text never persisted)
        env:
          PHASE1B_ARTIFACT_ENCRYPTION_KEY: ${{ secrets.PHASE1B_ARTIFACT_ENCRYPTION_KEY }}
          CACHE_RUN_ID: ${{ inputs.cache_run_id }}
        run: |
          set -euo pipefail
          trap 'rm -rf /tmp/phase1b-dev /tmp/phase1b-score-cache-v1' EXIT
          mkdir -p /tmp/phase1b-output /tmp/phase1b-score-cache
          python scripts/benchmarks/phase1b/doc_map.py \
            --cache /tmp/phase1b-score-cache-v1/phase1b-dev-score-cache.json \
            --dataset-path /tmp/phase1b-dev/dev.parquet \
            --output-cache /tmp/phase1b-score-cache/phase1b-dev-score-cache.json \
            --summary-output /tmp/phase1b-output/phase1b-dev-cluster-summary.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(Path("/tmp/phase1b-output/phase1b-dev-cluster-summary.json").read_text())
          serialized = json.dumps(summary, sort_keys=True)
          assert summary["split"] == "dev"
          assert summary["record_count"] == 30420
          assert summary["calibration_v2_replay"] == "matches_source"
          assert summary["instance_level_output_published"] is False
          assert "record_id" not in serialized
          assert "doc_id\"" not in serialized
          provenance = {
              "schema_version": "phase1b-dev-cache-v2-provenance-v1",
              "cache_run_id": os.environ["CACHE_RUN_ID"],
              "build_run_id": os.environ["GITHUB_RUN_ID"],
              "build_code_sha": os.environ["GITHUB_SHA"],
              "summary_sha256": summary["summary_sha256"],
              "manifest_sha256": summary["manifest_sha256"],
          }
          Path("/tmp/phase1b-output/PROVENANCE.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(provenance, sort_keys=True))
          PY
      # Encrypted v2 cache (AES-256-GCM); same artifact name so experiments can consume it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase1b-dev-score-cache
          path: /tmp/phase1b-score-cache/phase1b-dev-score-cache.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase1b-dev-cluster-summary
          path: |
            /tmp/phase1b-output/phase1b-dev-cluster-summary.json
            /tmp/phase1b-output/PROVENANCE.json
          if-no-files-found: error
          retention-days: 30

# No inference, no TEST split/job, no dispatch from repository tooling, no automatic trigger.
