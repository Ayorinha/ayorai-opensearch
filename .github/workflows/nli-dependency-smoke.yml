name: NLI Optional Dependency Smoke

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - ".github/workflows/nli-dependency-smoke.yml"
      - "requirements-nli-smoke.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nli-dependency-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-nli-smoke.txt
      - name: Install optional NLI dependencies
        run: |
          python -m pip install "pip==26.3" "setuptools==84.2.1"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.0"
          python -m pip install --index-url https://pypi.org/simple -e ".[dev,nli]"
          python -m pip install --index-url https://pypi.org/simple -r requirements-nli-smoke.txt
          pip check
      - name: Remove the local editable project before auditing third-party dependencies
        run: python -m pip uninstall -y ayorai-opensearch
      - name: Audit optional dependencies against OSV, including CPU PyTorch
        run: pip-audit --strict --vulnerability-service osv
      - name: Remove CPU PyTorch for the PyPI-native dependency audit
        run: python -m pip uninstall -y torch
      - name: Audit PyPI dependencies with strict collection
        run: pip-audit --strict
      - name: Restore the pinned CPU PyTorch wheel
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.0"
      - name: Restore the local project without changing resolved dependencies
        run: python -m pip install --no-deps -e .
      - name: Verify installed dependency versions
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import google.protobuf
          import huggingface_hub
          import numpy as np
          import pandas as pd
          import pyarrow as pa
          import pyarrow.parquet as pq
          import psutil
          import safetensors
          import sentencepiece
          import torch
          import transformers

          assert torch.version.cuda is None, "Expected CPU-only PyTorch build"

          packages = (
              "transformers", "torch", "protobuf", "sentencepiece",
              "huggingface-hub", "pyarrow", "pandas", "numpy", "psutil",
              "safetensors",
          )
          for package in packages:
              print(f"{package}=={version(package)}")

          frame = pd.DataFrame({
              "record_id": ["synthetic-a", "synthetic-b"],
              "score": np.asarray([0.25, 0.75], dtype=np.float64),
          })
          sink = pa.BufferOutputStream()
          pq.write_table(pa.Table.from_pandas(frame, preserve_index=False), sink)
          restored = pq.read_table(pa.BufferReader(sink.getvalue())).to_pandas()
          assert restored.equals(frame)
          assert psutil.Process().memory_info().rss > 0
          assert safetensors.__version__
          assert huggingface_hub.__version__ and google.protobuf.__version__
          print("BENCHMARK_PILOT_DEPENDENCIES_IMPORT: PASS")
          print("PARQUET_PANDAS_NUMPY_ROUNDTRIP: PASS")
          print("NLI_OPTIONAL_DEPENDENCIES_IMPORT: PASS")
          PY
      - name: Load pinned NLI model and exercise inference
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from transformers import AutoConfig, AutoTokenizer

          from ayorai_attractor.verification.nli import (
              EVAL_ONLY_LEVEL,
              EVAL_ONLY_MODEL,
              EVAL_ONLY_REVISION,
              TransformersNLIBackend,
              _resolve_label_map,
          )

          tokenizer = AutoTokenizer.from_pretrained(
              EVAL_ONLY_MODEL,
              revision=EVAL_ONLY_REVISION,
              use_fast=False,
          )
          config = AutoConfig.from_pretrained(
              EVAL_ONLY_MODEL,
              revision=EVAL_ONLY_REVISION,
          )
          label_map = _resolve_label_map(
              {int(index): str(label) for index, label in config.id2label.items()}
          )
          assert tokenizer is not None
          assert set(label_map.values()) == {"supports", "contradicts", "neutral"}

          # Exercise the actual backend path, including model weights, tokenization,
          # inference_mode, logits, softmax and label mapping on CPU.
          backend = TransformersNLIBackend(
              EVAL_ONLY_MODEL,
              EVAL_ONLY_REVISION,
              license_level=EVAL_ONLY_LEVEL,
              evaluation_mode=True,
          )
          result = backend.classify(
              "O atendimento telefônico deve ser gratuito.",
              "O atendimento telefônico deve ser gratuito em dias úteis.",
          )
          assert result["stance"] in {"supports", "contradicts", "neutral"}
          assert 0.0 <= float(result["confidence"]) <= 1.0
          print("NLI_TRANSFORMERS_RUNTIME_SMOKE: PASS")
          print("NLI_MODEL_INFERENCE_SMOKE: PASS")
          print("transformers==" + version("transformers"))
          print("model_revision=" + EVAL_ONLY_REVISION)
          print("label_map=" + repr(label_map))
          print("inference_stance=" + str(result["stance"]))
          print("inference_confidence=" + str(result["confidence"]))
          PY
      - name: Write CycloneDX SBOM of the audited environment
        run: |
          set -euo pipefail
          python -m pip uninstall -y ayorai-opensearch
          pip-audit --strict --vulnerability-service osv --format cyclonedx-json --output nli-sbom.cdx.json
          python -m pip install --no-deps -e .
          python - <<'PY'
          import json
          from pathlib import Path

          sbom = json.loads(Path("nli-sbom.cdx.json").read_text(encoding="utf-8"))
          names = {component["name"].lower() for component in sbom["components"]}
          for required in ("torch", "transformers", "numpy", "pandas", "pyarrow"):
              assert required in names, required
          print(f"SBOM_COMPONENTS: {len(names)}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nli-sbom-${{ github.sha }}
          path: nli-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Run test suite with NLI dependencies installed
        run: pytest -q
