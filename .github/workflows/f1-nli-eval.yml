name: F1 NLI Evaluation

on:
  workflow_dispatch:
  push:
    branches:
      - feat/f1-multilingual-stance

permissions:
  contents: read

jobs:
  f1-nli-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,nli]"
      - name: Run F1 A/B/C evaluation
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          set -o pipefail
          rm -rf reports
          mkdir -p reports
          python scripts/run_f1_eval.py --suite golden-v0.1 | tee reports/f1-eval-console.txt
      - name: Verify report hashes
        run: |
          test -s reports/f1-results.json
          test -s reports/F1-RESULTS.md
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path("reports/f1-results.json")
          data = json.loads(p.read_text())
          expected = data.pop("report_sha256")
          actual = hashlib.sha256(json.dumps(data, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          assert actual == expected, (actual, expected)
          print("report_sha256=", expected)
          PY
          sha256sum reports/f1-results.json reports/F1-RESULTS.md reports/f1-eval-console.txt
      - name: Upload F1 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: f1-nli-eval-${{ github.sha }}
          path: |
            reports/f1-results.json
            reports/F1-RESULTS.md
            reports/f1-eval-console.txt
