name: F1 NLI Evaluation

on:
  workflow_dispatch:
  push:
    branches:
      - feat/f1-multilingual-stance

permissions:
  contents: read

jobs:
  f1-nli-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,nli]"
      - name: Run F1 A/B/C evaluation
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          rm -rf reports
          mkdir -p reports
          python scripts/run_f1_eval.py | tee reports/f1-eval-console.txt
      - name: Verify report hashes
        run: |
          test -s reports/f1-results.json
          test -s reports/F1-RESULTS.md
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path("reports/f1-results.json")
          data = json.loads(p.read_text())
          expected = data.pop("report_sha256")
          actual = hashlib.sha256(json.dumps(data, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          assert actual == expected, (actual, expected)
          print("report_sha256=", expected)
          PY
      - name: Upload F1 evidence
        uses: actions/upload-artifact@v7
        with:
          name: f1-nli-eval-${{ github.sha }}
          path: |
            reports/f1-results.json
            reports/F1-RESULTS.md
            reports/f1-eval-console.txt
