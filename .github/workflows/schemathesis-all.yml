name: Schemathesis Full API Contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schemathesis-all:
    name: Schemathesis all contract checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and isolated Schemathesis
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m venv /tmp/st
          /tmp/st/bin/pip install schemathesis==4.29.4
          /tmp/st/bin/st --version
      - name: Start API
        run: |
          set -euo pipefail
          ATTRACTOR_AUTH_MODE=off uvicorn ayorai_attractor.api.app:app --host 127.0.0.1 --port 8000 --lifespan on > /tmp/attractor-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json > /tmp/openapi-live.json; then
              echo "API ready on attempt ${attempt}/30"
              break
            fi
            echo "Waiting for API (attempt ${attempt}/30)"
            sleep 1
          done
          test -s /tmp/openapi-live.json
      - name: Exercise all documented API contract checks
        run: |
          set -o pipefail
          mkdir -p reports/schemathesis .hypothesis/examples
          cp /tmp/openapi-live.json reports/schemathesis/openapi-live.json
          bash scripts/run_schemathesis_contract.sh /tmp/st/bin/st http://127.0.0.1:8000/openapi.json http://127.0.0.1:8000 2>&1 | tee reports/schemathesis/schemathesis.log
      - name: Show API log on failure
        if: failure()
        run: cat /tmp/attractor-api.log
      - name: Collect reproducible Schemathesis evidence
        if: always()
        run: |
          mkdir -p reports/schemathesis
          if [ -f /tmp/attractor-api.log ]; then cp /tmp/attractor-api.log reports/schemathesis/api.log; fi
          if [ -f /tmp/openapi-live.json ]; then cp /tmp/openapi-live.json reports/schemathesis/openapi-live.json; fi
          if [ -d .hypothesis/examples ]; then cp -R .hypothesis/examples reports/schemathesis/hypothesis-examples; fi
      - name: Upload Schemathesis evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schemathesis-evidence-${{ github.sha }}
          path: reports/schemathesis/
          if-no-files-found: warn
          retention-days: 14

  openapi-diff:
    name: OpenAPI compatibility with oasdiff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Generate base and current OpenAPI snapshots
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/attractor-api-base "$BASE_SHA"
          (
            cd /tmp/attractor-api-base
            PYTHONPATH="$PWD/src" python - <<'PY'
          import json
          from pathlib import Path
          from ayorai_attractor.api.app import app

          Path("/tmp/openapi-base.json").write_text(
              json.dumps(app.openapi(), ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          )
          PYTHONPATH="$PWD/src" python - <<'PY'
          import json
          from pathlib import Path
          from ayorai_attractor.api.app import app

          Path("/tmp/openapi-current.json").write_text(
              json.dumps(app.openapi(), ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Install pinned oasdiff release and verify SHA-256
        env:
          OASDIFF_VERSION: "1.33.0"
          OASDIFF_ARCHIVE: "oasdiff_1.33.0_linux_amd64.tar.gz"
          OASDIFF_SHA256: "43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/${OASDIFF_ARCHIVE}" \
            --output "${OASDIFF_ARCHIVE}"
          echo "${OASDIFF_SHA256}  ${OASDIFF_ARCHIVE}" | sha256sum --check -
          tar -xzf "${OASDIFF_ARCHIVE}" oasdiff
          mkdir -p "$HOME/.local/bin"
          install -m 0755 oasdiff "$HOME/.local/bin/oasdiff"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "oasdiff release v${OASDIFF_VERSION} verified by SHA-256 ${OASDIFF_SHA256}"
          "$HOME/.local/bin/oasdiff" --help > /dev/null
      - name: Reject breaking OpenAPI changes
        run: oasdiff breaking /tmp/openapi-base.json /tmp/openapi-current.json
