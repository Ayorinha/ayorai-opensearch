name: RGC Design Simulation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/simulate_rgc_design.py"
      - "docs/eval/PROPOSAL-RGC-STATISTICAL-DESIGN.md"
      - "docs/eval/PREREGISTRATION-RGC-v1.md"
      - "docs/eval/PROTOCOL-GOLDEN-V1.md"
      - "docs/eval/RUNNER-RGC-v1.md"
      - "evals/ptbr/rgc_eval.py"
      - "evals/ptbr/rgc_agreement.py"
      - "tests/test_rgc_eval_runner.py"
      - "tests/test_rgc_agreement.py"
      - ".github/workflows/rgc-design-simulation.yml"

permissions:
  contents: read

concurrency:
  group: rgc-design-simulation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rgc-design-simulation:
    name: rgc-design-simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install simulation environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "numpy==2.3.3"
          python --version
          python -c "import numpy; print('numpy', numpy.__version__)"
      - name: Execute complete RGC design simulation on synthetic labels
        run: |
          set -euo pipefail
          mkdir -p reports/rgc-design-simulation
          python scripts/simulate_rgc_design.py 2>&1 | tee reports/rgc-design-simulation/full-output.txt
      - name: Preserve full simulation output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rgc-design-simulation-${{ github.sha }}
          path: reports/rgc-design-simulation/full-output.txt
          if-no-files-found: warn
