name: Official Source Capture

# Captures official normative sources byte-for-byte for the PT-BR benchmark
# (DEC-002). Runs only on capture/** branches; results are committed back to
# the same branch so the capture is reviewed in a pull request before merge.

on:
  push:
    branches: ["capture/**"]
    paths:
      - "evals/ptbr/capture/targets.json"
      - "scripts/capture_sources.py"
      - ".github/workflows/source-capture.yml"

permissions: {}

concurrency:
  group: source-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture official sources
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the captured bytes back to the same capture/** branch
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Capture exact bytes and write manifest
        run: python scripts/capture_sources.py evals/ptbr/capture/targets.json evals/ptbr/sources/raw
      - name: Commit captured artifacts to this branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/ptbr/sources/raw
          if git diff --cached --quiet; then
            echo "Nothing captured."
            exit 0
          fi
          git commit -m "data(ptbr): capture official sources (run ${GITHUB_RUN_ID})"
          askpass="$(mktemp "${RUNNER_TEMP}/git-askpass.XXXXXX")"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push origin "HEAD:${GITHUB_REF_NAME}"
