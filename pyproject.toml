[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ayorai-opensearch"
version = "0.2.0"
description = "AYORAI ATTRACTOR adaptive multi-agent intelligence and verification engine."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Anderson Leon Ayora"}]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
nli = [
  "transformers>=4.55,<5",
  "torch>=2.7,<3",
  "protobuf>=5,<7",
]
telemetry = [
  "opentelemetry-api>=1.45,<2",
]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "httpx>=0.28,<1",
  "pip-audit>=2.9,<3",
  "bandit>=1.8,<2",
  "mcp>=2,<3",
  "openai-agents>=0.1,<1",
  "hypothesis>=6.100,<7",
  "PyYAML>=6.0,<7",
]

[project.scripts]
opensearch = "ayorai_attractor.cli.main:search"
attractor = "ayorai_attractor.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ayorai_attractor*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","I","B","UP"]

[tool.ruff.lint.isort]
known-first-party = ["ayorai_attractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

# Strict typing ratchet: this list only grows.
[[tool.mypy.overrides]]
module = ["ayorai_attractor.evidence", "ayorai_attractor.evidence.*"]
strict = true
