[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ayorai-opensearch"
version = "0.1.0"
description = "AYORAI ATTRACTOR adaptive multi-agent intelligence and verification engine."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Anderson Leon Ayora"}]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "httpx>=0.28,<1",
  "pip-audit>=2.9,<3",
  "bandit>=1.8,<2",
]

[project.scripts]
opensearch = "attractor.cli.main:app"

[tool.setuptools.packages.find]
include = ["attractor*", "agents*", "providers*", "evidence*", "failure_engine*", "evaluation*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","I","B","UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
