# PROPOSTA — workflow separado; não habilitar sem pin TEST e thresholds versionados.
name: Phase 1b TEST evaluation (proposal)

on:
  workflow_dispatch:
    inputs:
      test_revision:
        description: Must match the maintainer-approved immutable TEST pin
        required: true
        type: string
      test_sha256:
        description: Must match the maintainer-approved immutable TEST parquet SHA-256
        required: true
        type: string
      thresholds_sha256:
        description: SHA-256 of the already committed DEV-only frozen thresholds file
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-frozen-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: international-benchmark-maintainer-approval
    outputs:
      shard_matrix: ${{ steps.plan.outputs.shard_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Fail closed unless TEST pin and DEV thresholds are immutable and approved
        run: |
          python scripts/benchmarks/phase1b/validate_test_gate.py \
            --test-revision "${{ inputs.test_revision }}" \
            --test-sha256 "${{ inputs.test_sha256 }}" \
            --thresholds configs/benchmarks/phase1b-thresholds.json \
            --expected-thresholds-sha256 "${{ inputs.thresholds_sha256 }}" \
            --require-dev-only-provenance
      - id: plan
        run: |
          python scripts/benchmarks/phase1b/build_manifest.py \
            --split test --shard-size 1000 --order-by-id \
            --output /tmp/test-manifest.json
          python scripts/benchmarks/phase1b/emit_matrix.py \
            --manifest /tmp/test-manifest.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase1b-test-manifest
          path: /tmp/test-manifest.json
          if-no-files-found: error
          retention-days: 1

  evaluate-test-shards:
    needs: validate-frozen-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    environment: international-benchmark-maintainer-approval
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard_id: ${{ fromJSON(needs.validate-frozen-inputs.outputs.shard_matrix) }}
        model_id: [mdeberta, minicheck, factcg]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v7.0.1
        with:
          name: phase1b-test-manifest
          path: /tmp
      - name: Install exact benchmark dependencies
        run: python -m pip install -r requirements-benchmark-phase1b.txt
      - name: Verify pins and run frozen-threshold FP32 TEST shard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/benchmarks/phase1b/run_shard.py \
            --split test --shard-id "${{ matrix.shard_id }}" \
            --model-id "${{ matrix.model_id }}" \
            --thresholds configs/benchmarks/phase1b-thresholds.json \
            --dtype float32 --no-quantization --no-autocast \
            --sort-by-length-within-shard \
            --output /tmp/private-test-shard.bin
      - name: Encrypt before any artifact upload
        env:
          PHASE1B_ARTIFACT_ENCRYPTION_KEY: ${{ secrets.PHASE1B_ARTIFACT_ENCRYPTION_KEY }}
        run: |
          python scripts/benchmarks/phase1b/encrypt_artifact.py \
            --input /tmp/private-test-shard.bin \
            --output /tmp/test-shard.aesgcm --aad-from-github-context
          rm -f /tmp/private-test-shard.bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase1b-test-encrypted-${{ matrix.model_id }}-${{ matrix.shard_id }}
          path: /tmp/test-shard.aesgcm
          if-no-files-found: error
          retention-days: 1

  aggregate-test:
    if: ${{ always() && needs.validate-frozen-inputs.result == 'success' }}
    needs: [validate-frozen-inputs, evaluate-test-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: international-benchmark-maintainer-approval
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v7.0.1
        with:
          pattern: phase1b-test-encrypted-*
          path: /tmp/encrypted
          merge-multiple: true
      - name: Decrypt and publish aggregate metrics only
        env:
          PHASE1B_ARTIFACT_ENCRYPTION_KEY: ${{ secrets.PHASE1B_ARTIFACT_ENCRYPTION_KEY }}
        run: |
          python scripts/benchmarks/phase1b/aggregate_test.py \
            --encrypted-dir /tmp/encrypted \
            --thresholds configs/benchmarks/phase1b-thresholds.json \
            --bootstrap-replicates 10000 --bootstrap-seed 20261106 \
            --publish-aggregate-only reports/benchmarks/phase1b-test-aggregate.json
          rm -rf /tmp/encrypted
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase1b-test-aggregate-only
          path: reports/benchmarks/phase1b-test-aggregate.json
          if-no-files-found: error
          retention-days: 14

# This TEST workflow is a separate future approval gate.
# It cannot be enabled until the TEST dataset pin and frozen DEV threshold file
# are committed and reviewed. No TEST data is accessed by the DEV workflow.
